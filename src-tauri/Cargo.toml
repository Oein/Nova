[package]
name = "nova"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "nova_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Capitalized binary name so the macOS menu bar (which uses the executable
# filename for unbundled `tauri dev` runs) shows "Nova" rather than "nova".
[[bin]]
name = "Nova"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
notify-debouncer-full = "0.3"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
memmap2 = "0.9"
# rustls rather than native-tls: native-tls needs openssl-dev on Linux, which
# breaks the CI/cross-build matrix.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
sha2 = "0.10"
async-trait = "0.1"
anyhow = "1"
thiserror = "1"
once_cell = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
# test-util enables tokio's paused clock, so the rate limiter can be asserted
# without actually sleeping.
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time", "test-util"] }
