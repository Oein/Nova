<svg width="602" height="602" viewBox="-45 -45 602 602" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#1f1f1f"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#E85D04"/>
    </linearGradient>
    <clipPath id="squircle">
      <!-- Apple-style squircle (superellipse) for continuous-curve corners
           that match macOS app icon masks, instead of a simple rounded rect. -->
      <path d="
        M 115,0
        L 397,0
        C 457,0 512,55 512,115
        L 512,397
        C 512,457 457,512 397,512
        L 115,512
        C 55,512 0,457 0,397
        L 0,115
        C 0,55 55,0 115,0
        Z"/>
    </clipPath>
  </defs>

  <!-- Background with squircle corners -->
  <g clip-path="url(#squircle)">
    <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
  </g>

  <!-- Skewed N -->
  <g transform="translate(256, 256) skewX(-12) scale(2.4)">
    <!-- Left vertical bar -->
    <path d="M -48,-52 L -20,-52 L -20,20 L -48,20 Z" fill="url(#orange)"/>
    <!-- Diagonal stroke -->
    <path d="M -20,-52 L 8,-52 L 48,30 L 48,52 L 20,52 L -20,-30 Z" fill="url(#orange)"/>
    <!-- Right vertical bar -->
    <path d="M 20,-20 L 48,-20 L 48,52 L 20,52 Z" fill="url(#orange)"/>
  </g>

  <!-- Star spark (top-right) -->
  <g transform="translate(388, 136)">
    <path d="M 0,-34 L 6,-6 L 34,0 L 6,6 L 0,34 L -6,6 L -34,0 L -6,-6 Z" fill="#FFE08A"/>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
  </g>
</svg>
