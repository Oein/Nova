name: Release

# Builds Nova and attaches the installers to a release.
#
# macOS is built on a macOS runner, not cross-compiled: linking SDL needs
# Apple's frameworks, which ship with Xcode and are not redistributable, and
# `hdiutil` (which writes the .dmg) is macOS-only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v1.0.0)'
        required: true
        type: string

jobs:
  macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Test
        run: zig build test --summary all

      - name: Package
        env:
          ARCH: ${{ matrix.arch }}
        run: ./tools/package-macos.sh

      - name: Verify the image mounts
        run: |
          hdiutil attach dist/*.dmg -mountpoint /Volumes/NovaCheck -nobrowse
          test -x "/Volumes/NovaCheck/Nova.app/Contents/MacOS/Nova"
          test -f "/Volumes/NovaCheck/Nova.app/Contents/Info.plist"
          hdiutil detach /Volumes/NovaCheck

      - uses: actions/upload-artifact@v4
        with:
          name: Nova-macos-${{ matrix.arch }}-dmg
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        run: zig build -Doptimize=ReleaseSafe

      - uses: actions/upload-artifact@v4
        with:
          name: Nova-windows-x64
          path: zig-out/bin/
          if-no-files-found: error

  publish:
    name: Attach to the release
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: true
